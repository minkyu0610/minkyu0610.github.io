<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minkyu · 개인 도구함</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b24; --panel2:#1c232e; --line:#2a3340;
    --tx:#e6edf3; --tx2:#9aa7b6; --tx3:#6b7887; --acc:#f0a000; --acc2:#ffc94d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--tx); min-height:100vh;
    font-family:"Pretendard","Segoe UI",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    font-size:14px; line-height:1.6; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px;margin:0 auto;padding:64px 20px 80px}

  h1{font-size:26px;margin:0 0 6px;font-weight:800;letter-spacing:-.5px}
  h1 span{color:var(--acc)}
  .lede{color:var(--tx3);font-size:14px;margin:0 0 36px}

  h2{font-size:12px;color:var(--tx3);font-weight:700;letter-spacing:.8px;
     text-transform:uppercase;margin:0 0 12px}

  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  a.card{
    display:block;text-decoration:none;color:inherit;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:20px;transition:border-color .15s,background .15s,transform .15s;
  }
  a.card:hover{border-color:var(--acc);background:var(--panel2);transform:translateY(-2px)}
  .card .top{display:flex;align-items:center;gap:11px;margin-bottom:8px}
  .card .ico{
    width:34px;height:34px;border-radius:9px;background:var(--panel2);
    display:grid;place-items:center;font-size:18px;flex:none;border:1px solid var(--line);
  }
  .card h3{margin:0;font-size:15.5px;font-weight:700}
  .card p{margin:0;color:var(--tx3);font-size:12.5px;line-height:1.65}
  .card .go{color:var(--acc2);font-size:12px;font-weight:700;margin-top:12px;display:block}

  footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);
         color:var(--tx3);font-size:12px;line-height:1.8}
  footer a{color:var(--tx2)}
</style>
</head>
<body>
<div class="wrap">

  <h1>개인 <span>도구함</span></h1>
  <p class="lede">직접 쓰려고 만든 것들. 필요할 때마다 하나씩 늘어납니다.</p>

  <h2>도구</h2>
  <div class="grid">

    <a class="card" href="./maple/">
      <div class="top">
        <div class="ico">🍁</div>
        <h3>메이플 환산 대시보드</h3>
      </div>
      <p>등록해둔 캐릭터를 한 번에 조회해 표로 비교하고,
         환산 · 보스컷 · 스펙업 순서 · 헥사강화를 한 화면에서 확인합니다.</p>
      <span class="go">열기 →</span>
    </a>

  </div>

  <footer>
    데이터는 각 도구의 브라우저 저장소에만 보관되며 서버로 전송되지 않습니다.<br>
    소스 · <a href="https://github.com/minkyu0610/minkyu0610.github.io" target="_blank" rel="noopener">github.com/minkyu0610</a>
  </footer>

</div>
</body>
</html>
